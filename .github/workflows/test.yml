name: CI Pipeline
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
        if: hashFiles('package-lock.json') != ''
      - name: Lint
        run: npm run lint
        if: hashFiles('package-lock.json') != ''
      - name: Build/Type-check
        run: npm run build
        if: hashFiles('package-lock.json') != ''
      - name: Test
        run: npm test
        if: hashFiles('package-lock.json') != ''
      - name: Summary
        if: always()
        run: echo "CI completed for Node ${{ matrix.node }}" >> $GITHUB_STEP_SUMMARY
